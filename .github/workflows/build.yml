name: Build Northstar from source
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: northstar-source-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig fonts-dejavu-core openjdk-17-jdk python3-pip rsync python3-protobuf openssl
          python3 -m pip install -r requirements.txt
      - name: Prepare disposable runner
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 12G /mnt/northstar.swap
          sudo chmod 600 /mnt/northstar.swap
          sudo mkswap /mnt/northstar.swap
          sudo swapon /mnt/northstar.swap
          df -h
      - name: Fetch verified device bundle
        run: python3 tools/download_inputs.py --output inputs
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 2 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          NORTHSTAR_BUILD_ROOT: /mnt/northstar-build
        run: bash tools/build_source.sh
      - name: Upload build and diagnostic records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-avr-source-build
          path: |
            /mnt/northstar-build/out/target/product/avr/recovery.img
            out/build.log
            out/source-manifest.xml
            out/source-image-validation.json
            out/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
